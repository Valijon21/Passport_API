name: ID Card & Passport OCR CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies (Tesseract & OpenCV libs)
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus libgl1 libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Django Security & Unit Tests
      env:
        SECRET_KEY: 'ci-testing-key-never-use-in-production'
        DEBUG: 'False'
        TESSERACT_CMD: '/usr/bin/tesseract'
      run: |
        cd backend
        python manage.py check --deploy
        python manage.py test tests.test_mrz_validation tests.test_idcard_davronov tests.test_id_full
