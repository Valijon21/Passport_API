upstream backend_upstream {
    server backend:8000;
}

# Rate limiting zone (30 requests per minute per IP for OCR endpoints)
limit_req_zone $binary_remote_addr zone=ocr_limit:10m rate=30r/m;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 15M;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API endpoints
    location /api/ {
        limit_req zone=ocr_limit burst=10 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for CPU-intensive OCR
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Swagger Documentation
    location /api/schema/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    location /api/docs/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }
}
